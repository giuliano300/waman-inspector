name: Inspector CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Inspector
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        run: nuget restore Waman_app.sln
      - name: Build solution
        run: msbuild Waman_app.sln /p:Configuration=Release /p:Platform="Any CPU" /m
